<div class="flex items-end justify-center py-6">
      @for (value of scale(); track value; let i = $index) {
        <button
          type="button"
          class="relative ml-[-20px] h-[82px] w-[58px] origin-bottom rounded-[10px] border-2 border-white/10 bg-panel font-display text-xl font-semibold text-text transition-[transform,box-shadow,border-color] duration-150 ease-[cubic-bezier(0.34,1.56,0.64,1)] first:ml-0 hover:z-20 hover:[--ty:-16px] disabled:cursor-not-allowed disabled:opacity-50"
          [class]="value === selectedValue() ? 'z-20 border-cyan shadow-[0_0_20px_rgb(77_216_255_/_0.35)] [--ty:-22px]' : ''"
          [style.transform]="'rotate(' + fanAngle(i, scale().length) + 'deg) translateY(var(--ty, 0px))'"
          [disabled]="disabled()"
          (click)="onSelect(value)"
        >
          {{ value }}
        </button>
      }
    </div>
