@if (rounds().length > 0) {
      <table class="history">
        <thead>
          <tr>
            <th>#</th>
            <th>Ticket</th>
            <th>Avg</th>
            <th>Spread</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (round of orderedRounds(); track round.revealedAt) {
            <tr>
              <td>{{ round.index }}</td>
              <td>{{ round.ticket ?? '—' }}</td>
              <td>{{ round.average ?? '—' }}</td>
              <td>{{ round.spread }}</td>
              <td>
                @if (round.consensus) {
                  <span title="Consensus">🎉</span>
                }
              </td>
            </tr>
          }
        </tbody>
      </table>
    } @else {
      <p class="empty">No rounds yet.</p>
    }
